server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: legacy-migration-agentops-orchestrator
  datasource:
    url: jdbc:postgresql://localhost:5432/migration_orchestrator
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25

enterprise:
  agentops:
    engine:
      base-url: ${AGENT_ENGINE_URL:http://localhost:8000}
      api-key: ${AGENT_ENGINE_KEY:dev-agentops-internal-key}
      connect-timeout: 10s
      read-timeout: 300s
      max-retries: 3

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.enterprise.agentops: DEBUG
    org.springframework.web.client.RestClient: DEBUG
